services:
  wrong-notebook:
    build: .
    image: wrong-notebook:1.0.0
    container_name: wrong-notebook
    restart: unless-stopped
    ports:
      - "9080:8000"
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      APP_SECRET: ${APP_SECRET:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-12}
      TOKEN_DAYS: ${TOKEN_DAYS:-30}
    volumes:
      - ./data:/data
